[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drought-germany"
version = "0.1.0"
description = "De-Martonne-Karten und bivariate Klimakarten für Deutschland"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "rasterio>=1.3", "matplotlib>=3.7", "Pillow>=10"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4"]

[project.scripts]
drought = "drought.cli:main"

[tool.setuptools.packages.find]
include = ["drought*"]
